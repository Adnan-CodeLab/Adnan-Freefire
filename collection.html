<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weapons - Free Fire Encyclopedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="images/fevicon.jpg" type="x-icon"></link>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/circle.css">
</head>
<body>

<header class="header">
    <div class="header-container">

        <!-- Logo -->
        <a href="index.html" class="logo">
            <div class="logo-icon">FF</div>
            <span class="logo-text">FREE FIRE</span>
        </a>

        <!-- Navigation -->
        <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>

            <!-- Dropdown -->
            <div class="dropdown-trigger">
                <button class="nav-link nav-link-active">
                    Game
                    <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6,9 12,15 18,9"></polyline>
                    </svg>
                </button>

                <div class="dropdown-menu">
                    <a href="weapons.html" class="dropdown-item active">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="22" y1="12" x2="18" y2="12"></line>
                            <line x1="6" y1="12" x2="2" y2="12"></line>
                            <line x1="12" y1="6" x2="12" y2="2"></line>
                            <line x1="12" y1="22" x2="12" y2="18"></line>
                        </svg>
                        Weapons
                    </a>

                    <a href="characters.html" class="dropdown-item">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                        </svg>
                        Characters
                    </a>

                    <a href="pets.html" class="dropdown-item">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        Pets
                    </a>

                    <a href="collection.html" class="dropdown-item">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        </svg>
                        Collection
                    </a>
                </div>
            </div>

            <a href="news.html" class="nav-link">News</a>
            <a href="events.html" class="nav-link">Events</a>
            <a href="media.html" class="nav-link">Media</a>
            <a href="https://adnan-codelab.github.io/My-Portfolio/" class="nav-link">Developer Info</a>
        </nav>

        <!-- Header Right -->
        <div class="header-right">
            <div class="search-container">
                <button class="icon-btn" id="searchToggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <div class="search-dropdown" id="searchDropdown">
                    <input type="text" placeholder="Search weapons, characters..." class="search-input">
                </div>
            </div>
        </div>

    </div>
</header>

  <!-- Main Bundles Content -->
  <main class="bundles-main">
    <!-- Main Categories (Left) -->
    <aside class="bundles-categories">
      <div class="categories-list" id="categoriesList">
        <!-- Dynamically populated -->
      </div>
      <button class="categories-expand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6,9 12,15 18,9"></polyline>
        </svg>
      </button>
    </aside>

    <!-- Sub-Categories (Images Only) -->
    <aside class="bundles-subcategories">
      <div class="subcategories-list" id="subcategoriesList">
        <!-- Dynamically populated -->
      </div>
    </aside>

    <!-- Content Area (Grid) -->
    <section class="bundles-content">
      <!-- Filter Bar -->
      <div class="bundles-filter-bar">
        <span class="filter-label">ALL RARITY</span>
        <div class="filter-dropdown">
          <span><a href="collection.html">All</a></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 12,15 18,9"></polyline>
          </svg>
        </div>
        <div class="filter-icons">
          <button class="filter-icon-btn" title="Favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3-Column Grid -->
      <div class="items-grid-container">
        <div class="items-grid" id="itemsGrid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </section>

    <!-- Main Preview (Right Side) -->
    <aside class="bundles-preview">
      <!-- Background Effects -->
      <div class="preview-bg-glow"></div>
      <div class="preview-bg-floor"></div>

      <!-- Preview Container -->
      <div class="preview-container">
        <div class="preview-media">
          <img id="previewImage" src="" alt="Preview">
          <video id="previewVideo" src="" muted loop playsinline style="display: none;"></video>
          <div class="preview-info" id="previewInfo" style="display: none;">
            <div class="info-content">
              <p class="info-description" id="infoDescription"></p>
              <div class="info-details">
                <span class="info-rarity" id="infoRarity"></span>
                <span class="info-price" id="infoPrice"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Item Label -->
        <div class="preview-label">
          <span class="item-icon" id="itemIcon"></span>
          <span class="item-name" id="itemName">Select an item</span>
          <span class="item-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
        </div>
      </div>

      <!-- Preview Options (Right Side) -->
      <div class="preview-options">
        <button class="preview-option-btn" id="videoOption" title="Video Preview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
        <button class="preview-option-btn" id="infoOption" title="Item Info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>
        <button class="preview-option-btn" title="Try On">
          <span class="option-count">20k</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </aside>
  </main>

  <script src="js/bundles-data.js"></script>
  <script src="js/bundles.js"></script>
</body>
</html>
